[package]
name = "chiron-core"
version = "0.1.0"
edition = "2021"
description = "High-performance Rust core for the Chiron semantic folding pipeline (SDR / SNN / GAT / HTM)"
license = "MIT"

[dependencies]
ndarray = { version = "0.16", features = ["rayon"] }
rayon = "1.10"
rand = "0.8"
rand_distr = "0.4"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.bench]
inherits = "release"
